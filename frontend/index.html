<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteForge</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect width='32' height='32' rx='8' fill='%230A7B83'/%3E%3Cpath d='M7 24 L13 16 C15 13 17 10 25 9' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M13 16 C15 19 18 22 25 23' stroke='%233FD0C9' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // 在应用加载前应用已保存的外观，避免深色模式首屏闪白（键名与 src/lib/appearance.ts 一致）
      try {
        var s = JSON.parse(localStorage.getItem('rf-appearance') || '{}')
        var dark = s.mode === 'dark' || (s.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
